project:
  type: website
  output-dir: _site
  resources:
    - "CNAME"
    - "!archive/**"
  post-render:
    - python _strip-icons.py

website:
  title: "Brandon Russell"
  description: "Cybersecurity educator and U.S. Air Force cyber officer."
  site-url: https://brandonrussell.io
  favicon: images/favicon.svg
  image: /images/social-card.png
  image-alt: "Brandon Russell, Ed.D. - cybersecurity educator and U.S. Air Force cyber officer"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
    creator: "@Dr_BRussell"
    site: "@Dr_BRussell"
  navbar:
    pinned: true
    left:
      - href: about.qmd
        text: About
      - href: teaching.qmd
        text: Teaching
      - href: writing.qmd
        text: Writing
      - href: publications.qmd
        text: Publications
      - href: projects.qmd
        text: Projects
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
  page-footer:
    border: true
    left: |
      &copy; 2026 Brandon Russell &middot; Built with [Quarto](https://quarto.org)
    right:
      - icon: github
        href: https://github.com/Brandon-Russell-1
      - icon: linkedin
        href: https://www.linkedin.com/in/brandon-r-russell/
      - icon: twitter-x
        href: https://x.com/Dr_BRussell
      - icon: youtube
        href: https://www.youtube.com/@Dr.BrandonRussell
      - icon: medium
        href: https://medium.com/@brandon.r.russell.1
      - icon: envelope
        href: mailto:brandon.r.russell.1@gmail.com

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    canonical-url: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    toc: false
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    citations-hover: true
    footnotes-hover: true
    mainfont: "Source Sans 3, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    monofont: "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
    fontsize: "1.05rem"
    linkcolor: "#1f5582"
    grid:
      sidebar-width: 200px
      body-width: 760px
      margin-width: 200px
